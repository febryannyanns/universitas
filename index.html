  const MONTHS = {
    Januari: "January",
    Februari: "February",
    Maret: "March",
    April: "April",
    Mei: "May",
    Juni: "June",
    Juli: "July",
    Agustus: "August",
    September: "September",
    Oktober: "October",
    November: "November",
    Desember: "December"
  };

  const REGEX_RULES = [
    [/^(\d+) hasil$/, "$1 results"],
    [/^(\d+) program studi$/, "$1 study programs"],
    [/^Sekitar (\d+) jurnal tepercaya$/, "About $1 trusted journals"],
    [/^Telepon: (.*)$/, "Phone: $1"],
    [/^Selamat datang, (.*)!$/, "Welcome, $1!"],
    [
      /^(\d{1,2}) (Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember) (\d{4})$/,
      (match, day, month, year) => `${MONTHS[month]} ${day}, ${year}`
    ]
  ];

  // =========================================================================
  // FUNGSI PENERJEMAHAN
  // =========================================================================
  function translateText(text) {
    const trimmed = text.trim();
    if (!trimmed) return text;

    if (DICTIONARY[trimmed] !== undefined) {
      return text.replace(trimmed, DICTIONARY[trimmed]);
    }

    for (const [regex, replacement] of REGEX_RULES) {
      if (regex.test(trimmed)) {
        return text.replace(trimmed, trimmed.replace(regex, replacement));
      }
    }

    return text;
  }

  // =========================================================================
  // LOGIKA MESIN DOM TRANSLATOR
  // =========================================================================
  const originalNodeValues = new WeakMap();
  const SKIP_TAGS = { SCRIPT: true, STYLE: true, TEXTAREA: true };
  let currentLang = "id";
  let isProcessing = false;

  function traverseAndTranslate(node) {
    // 1. Text Node
    if (node.nodeType === Node.TEXT_NODE) {
      if (!node.parentNode || SKIP_TAGS[node.parentNode.nodeName]) return;

      if (currentLang === "en") {
        if (!originalNodeValues.has(node)) {
          originalNodeValues.set(node, node.nodeValue);
        }
        const translated = translateText(originalNodeValues.get(node));
        if (translated !== node.nodeValue) {
          node.nodeValue = translated;
        }
      } else if (originalNodeValues.has(node)) {
        node.nodeValue = originalNodeValues.get(node);
      }
    } 
    // 2. Element Node
    else if (node.nodeType === Node.ELEMENT_NODE) {
      if (SKIP_TAGS[node.nodeName]) return;

      if (node.hasAttribute && node.hasAttribute("placeholder")) {
        if (currentLang === "en") {
          if (!node.dataset.phId) {
            node.dataset.phId = node.getAttribute("placeholder");
          }
          node.setAttribute("placeholder", translateText(node.dataset.phId));
        } else if (node.dataset.phId) {
          node.setAttribute("placeholder", node.dataset.phId);
        }
      }

      node.childNodes.forEach(traverseAndTranslate);
    }
  }

  function applyTranslation() {
    isProcessing = true;
    traverseAndTranslate(document.body);
    isProcessing = false;
  }

  // Mengamati perubahan DOM dinamis
  new MutationObserver((mutations) => {
    if (isProcessing || currentLang !== "en") return;
    isProcessing = true;
    mutations.forEach((mutation) => mutation.addedNodes.forEach(traverseAndTranslate));
    isProcessing = false;
  }).observe(document.body, { childList: true, subtree: true });

  function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;

    try {
      localStorage.setItem("un_lang", lang);
    } catch (error) {
      console.warn("Storage access restricted:", error);
    }

    applyTranslation();

    document.querySelectorAll("[data-l]").forEach((btn) => {
      btn.classList.toggle("on", btn.dataset.l === lang);
    });
  }

  // =========================================================================
  // INISIALISASI TOMBOL & EVENT
  // =========================================================================
  // Tombol EN | ID di Header
  const headerBox = document.querySelector(".lang");
  if (headerBox) {
    headerBox.innerHTML = '<button data-l="en">EN</button><i class="sep"></i><button data-l="id">ID</button>';
  }

  // Tombol Bahasa di Menu Samping (Mobile)
  const menuPanel = document.getElementById("menuPanel");
  if (menuPanel) {
    menuPanel.insertAdjacentHTML(
      "beforeend",
      '<div class="lang-menu"><button data-l="en">EN</button><i class="sep"></i><button data-l="id">ID</button></div>'
    );
  }

  // Link "Language: ID/EN" di Bar Atas
  document.querySelectorAll(".top-bar a").forEach((link) => {
    if (/language/i.test(link.textContent)) {
      link.style.cursor = "pointer";
      link.addEventListener("click", (event) => {
        event.preventDefault();
        setLanguage(currentLang === "en" ? "id" : "en");
      });
    }
  });

  // Listener untuk seluruh tombol bergaya data-l
  document.querySelectorAll("[data-l]").forEach((btn) => {
    btn.addEventListener("click", () => setLanguage(btn.dataset.l));
  });

  // Panggil bahasa tersimpan atau default "id"
  let savedLang = "id";
  try {
    savedLang = localStorage.getItem("un_lang") || "id";
  } catch (error) {
    console.warn("Storage access restricted:", error);
  }

  setLanguage(savedLang);
})();
